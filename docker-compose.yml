services:
  # ============================================
  # 后端服务 (FastAPI Multi-Agent)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salespilot_backend
    hostname: backend
    ports:
      - "8080:8080"
    environment:
      # OpenAI配置
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-test-key-placeholder}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo-preview}

      # RAG服务配置（容器内通信）
      - RAG_SERVICE_URL=http://moocowagent_rag:8001
      - RAG_SERVICE_TIMEOUT=120
      - RAG_DEFAULT_USER_ID=default_user

      # 数据库配置（容器内通信）
      - DATABASE_URL=postgresql://postgres:pg123456@gsk_pg:5432/gsk

      # JWT认证（与RAG服务共享密钥）
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-default_secret_key}

      # 应用配置
      - APP_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      # 持久化存储
      - ./backend/logs:/app/logs
      - ./backend/storage:/app/storage
      - ./backend/user_memories:/app/user_memories
      # 开发模式：代码实时同步（已启用）
      - ./backend:/app
    depends_on:
      moocowagent_rag:
        condition: service_started
      gsk_pg:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - gsk_network
    healthcheck:
      # 镜像未安装 curl，用 python urllib 探活
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # RAG服务 (MooCow-Agent)
  # ============================================
  moocowagent_rag:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    image: moocowagent-rag:latest
    hostname: moocowagent_rag
    container_name: moocowagent_rag
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - DATABASE_URL=postgresql://postgres:pg123456@gsk_pg:5432/gsk
      - ES_HOST=http://es01:9200
      - ROOT_PATH=http://localhost:8001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./rag-service/.env
    ports:
      - "8001:8001"
    # 生产模式：代码已打包进镜像，无需挂载
    # 开发模式：取消下方注释实现代码热重载
    volumes:
      - ./rag-service/app:/app
    command: ["uvicorn", "app_main:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped
    depends_on:
      - gsk_pg
      - es01
      - redis
    networks:
      - gsk_network

  # ============================================
  # Elasticsearch (向量数据库)
  # ============================================
  es01:
    container_name: gsk-es-01
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    volumes:
      - gsk_esdata01:/usr/share/elasticsearch/data
    env_file: ./rag-service/.env
    environment:
      - node.name=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-elastic123456}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    mem_limit: ${MEM_LIMIT:-2g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: on-failure
    networks:
      - gsk_network

  # ============================================
  # PostgreSQL (关系数据库)
  # ============================================
  gsk_pg:
    container_name: gsk_pg
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=pg123456
      - POSTGRES_USER=postgres
      - POSTGRES_DB=gsk
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./rag-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - gsk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis (缓存)
  # ============================================
  redis:
    container_name: gsk_redis
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - gsk_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gsk_esdata01:
    driver: local
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  gsk_network:
    driver: bridge
